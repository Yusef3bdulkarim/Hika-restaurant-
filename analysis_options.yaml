# Base: flutter_lints (includes lints/recommended). Below = stricter project rules only.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/core/l10n/generated/**

linter:
  rules:
    # Style consistency
    - prefer_single_quotes
    - directives_ordering
    - avoid_redundant_argument_values
    # Immutability
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    # Type safety
    - always_declare_return_types
    - avoid_dynamic_calls
    # Async bugs
    - unawaited_futures
